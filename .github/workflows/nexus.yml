name: Publish to Nexus

# Manual only. Uploads the zip from an existing GitHub Release to Nexus Mods with
# the official Nexus-Mods/upload-action. Needs the NEXUS_API_KEY repository secret.
# Run the "Release" workflow first so the GitHub Release (and its zip) exists.
#
# Find the ids on Nexus: tick "Advanced" on the mod's Files tab, or open the
# Manage Files page.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. 1.4.1)'
        required: true
      file_id:
        description: 'Nexus file id to add the new version to'
        required: true
      mod_id:
        description: 'Nexus mod id (needed to add the changelog)'
        required: true
      publish:
        description: 'Actually upload to Nexus (leave unchecked for a dry run)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nexus:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download release zip
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir .

      - name: Extract changelog for this version
        id: notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($env:TAG))\s*$") { $start = $i + 1; break }
          }
          if ($start -lt 0) { Write-Error "No '## $($env:TAG)' section in CHANGELOG.md."; exit 1 }
          $notes = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { break }
            $notes += $lines[$i]
          }
          $text = ($notes -join "`n").Trim()
          "changelog<<EOF`n$text`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host $text

      - name: Find zip name
        id: zip
        run: echo "name=$(ls BetterLootMarkers-*.zip | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Dry run summary
        if: ${{ !inputs.publish }}
        run: |
          echo "Dry run. Would upload ${{ steps.zip.outputs.name }} as version $TAG"
          echo "to file ${{ inputs.file_id }} of mod ${{ inputs.mod_id }}. Tick 'publish' to do it."

      # Pinned to the commit of v1.0.0-beta.11 (a beta release) for supply-chain safety.
      - name: Upload to Nexus Mods
        if: ${{ inputs.publish }}
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ inputs.file_id }}
          filename: ${{ steps.zip.outputs.name }}
          version: ${{ inputs.tag }}
          display_name: BetterLootMarkers ${{ inputs.tag }}
          category: main
          update_mod_version: true
          mod_id: ${{ inputs.mod_id }}
          changelog: ${{ steps.notes.outputs.changelog }}
